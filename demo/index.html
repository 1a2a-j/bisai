<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>潮起山海｜互动叙事作品</title>
    <style>
        /* ========== 全局样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            background: #1a2a3a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ========== 主容器 ========== */
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            padding: 36px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        /* ========== 画面区域（图片/视频二选一） ========== */
        .scene-media {
            width: 100%;
            height: 380px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 28px;
            display: block;
        }

        /* ========== 剧情文字 ========== */
        .story-text {
            font-size: 20px;
            line-height: 1.8;
            margin-bottom: 32px;
            text-indent: 2em;
        }

        /* ========== 选项按钮 ========== */
        .option-btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 10px 0;
            background: #2c6bc4;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .option-btn:hover {
            background: #1f55a0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 画面：默认显示图片，想换视频就把img换成video标签 -->
        <img id="sceneMedia" class="scene-media" src="" alt="场景画面">

        <!-- 剧情文字 -->
        <div id="storyText" class="story-text"></div>

        <!-- 选项按钮容器 -->
        <div id="optionBox"></div>
    </div>

    <script>
        // ==================================================
        // 【重点修改区】所有剧情、图片、分支都在这里加
        // 格式：节点名:{ text:"剧情文字", img:"图片路径", options:[{label:"按钮文字", next:"下一个节点名"}] }
        // ==================================================
        const storyData = {
            // 开场节点
            start: {
                text: "少年阿屿来到潮汕大地，山海之间，传统文化与青年新机遇在此交融。你会选择哪一条路探索？",
                img: "img/start.jpg",
                options: [
                    { label: "探访潮汕非遗", next: "feiyi" },
                    { label: "探访滨海青年创业", next: "chuangye" }
                ]
            },

            // 非遗分支节点
            feiyi: {
                text: "走入潮汕古村落，锣鼓声声，非遗传承就在眼前。你想要体验哪一项非遗？",
                img: "img/feiyi.jpg",
                options: [
                    { label: "观看英歌舞表演", next: "end1" },
                    { label: "体验潮汕剪纸", next: "end2" }
                ]
            },

            // 创业分支节点
            chuangye: {
                text: "海边小镇，不少年轻人返乡扎根，开启创业之路。你想了解哪一种创业？",
                img: "img/chuangye.jpg",
                options: [
                    { label: "乡村文旅创业", next: "end3" },
                    { label: "直播带货潮汕特产", next: "end4" }
                ]
            },

            // 结局1
            end1: {
                text: "结局：古老烟火。气势磅礴的英歌舞代代相传，古老民俗在乡村持续焕发活力。",
                img: "img/end1.jpg",
                options: [
                    { label: "重新开始", next: "start" }
                ]
            },

            // 结局2
            end2: {
                text: "结局：指尖文脉。一张红纸，一把剪刀，潮汕剪纸，将乡土故事裁剪进纹样之中。",
                img: "img/end2.jpg",
                options: [
                    { label: "重新开始", next: "start" }
                ]
            },

            // 结局3
            end3: {
                text: "结局：山海新业。返乡青年打造乡村文旅，吸引游客，让古村重新热闹起来。",
                img: "img/end3.jpg",
                options: [
                    { label: "重新开始", next: "start" }
                ]
            },

            // 结局4
            end4: {
                text: "结局：潮货出圈。青年通过直播，把潮汕橄榄、工夫茶等特产销往全国各地。",
                img: "img/end4.jpg",
                options: [
                    { label: "重新开始", next: "start" }
                ]
            }

            // ===== 在这里继续加新节点、新分支 =====
        };

        // ==================================================
        // 渲染逻辑（不用改，新增节点自动生效）
        // ==================================================
        let currentNode = "start"; // 当前所在剧情节点

        function renderScene() {
            const node = storyData[currentNode];
            
            // 更新文字和画面
            document.getElementById("storyText").innerText = node.text;
            document.getElementById("sceneMedia").src = node.img;

            // 生成选项按钮
            const btnBox = document.getElementById("optionBox");
            btnBox.innerHTML = ""; // 清空旧按钮

            node.options.forEach(item => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = item.label;
                
                // 点击按钮切换剧情
                btn.onclick = () => {
                    currentNode = item.next;
                    renderScene();
                };

                btnBox.appendChild(btn);
            });
        }

        // 页面加载完成，渲染开场
        renderScene();
    </script>
</body>
</html>
